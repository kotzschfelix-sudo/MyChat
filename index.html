input{width:100%;background:#0c0e13;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;outline:none}input:focus{border-color:#858d9c}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel2);color:var(--text)}.btn.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:650}.btn.subtle{background:transparent}.btn.danger{color:#fecaca}.btn.full{width:100%}.topbar a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}

.workspace{min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;padding:14px 0}.sidebar,.chat-panel{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:18px;min-height:0}.sidebar{display:flex;flex-direction:column;overflow:hidden}.side-scroll{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:16px}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}.search-results,.request-list,.contact-list{display:grid;gap:7px}.result,.contact,.request{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--text);text-align:left;width:100%}.result:hover,.contact:hover,.contact.active{background:var(--panel2);border-color:var(--line)}.avatar{width:38px;height:38px;border-radius:50%;background:#303642;color:#fff;display:grid;place-items:center;font-weight:700;flex:none;position:relative;overflow:hidden}.avatar-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}.avatar-button{border:1px solid var(--line);padding:0;color:var(--text);cursor:pointer}.avatar-button .avatar-image{z-index:1}.person{min-width:0;flex:1}.person b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person small{display:block;color:var(--muted);margin-top:3px}.request-actions{display:flex;gap:5px}.request-actions .btn{padding:6px 9px;font-size:12px}.empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 12px}

center;padding:18px;z-index:20}.share-dialog{width:min(420px,100%);background:#151820;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 60px #0009}.share-dialog h3{margin:0 0 12px}.share-dialog select{width:100%;padding:12px;background:#0c0e13;color:var(--text);border:1px solid var(--line);border-radius:10px}.share-dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.bubble.mine .message-file{color:#12141a;border-color:#b8bbc3}.attachment-note{font-size:12px;color:var(--muted);padding:5px 14px 0}.welcome{margin:auto;text-align:center;padding:28px;max-width:420px}.welcome .big-icon{font-size:42px;margin-bottom:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#272c36;border:1px solid #424958;padding:10px 15px;border-radius:12px;z-index:10;max-width:calc(100vw - 30px);box-shadow:0 10px 30px #0008}
.section-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.section-row .section-title{margin:0}.group-form{display:grid;gap:8px;margin:10px 0;padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px}.group-options{display:grid;gap:6px;max-height:150px;overflow:auto}.group-option{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)}.group-option input{width:auto}.group{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--text);text-align:left;width:100%}.group:hover,.group.active{background:var(--panel2);border-color:var(--line)}
@media(max-width:760px){.app{padding:0;grid-template-rows:60px 1fr}.topbar{padding:0 12px}.workspace{padding:8px;grid-template-columns:1fr;gap:8px}.sidebar{min-height:0;max-height:42vh}.chat-panel{min-height:0}.side-scroll{padding:10px}.chat-head{height:58px;padding:9px 12px}.messages{padding:12px}.bubble{max-width:88%}.user-pill > span{display:none}}

<body>
<div id="root"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';

const SUPABASE_URL = 'https://pmlcstqpmmoiqnvfxspl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_kx4UGLboJuhwN6P3JcbNZg_-39zZoZV';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (s) => document.querySelector(s);
const state = { user:null, username:'', requests:[], contacts:[], chats:[], groups:[], activeChat:null, activeChatType:null, activeGroupTitle:'', activeContact:null, requestProfiles:{}, messages:[], pinnedMessages:[], channel:null, searchTimer:null };
const esc = (v='') => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = (s='?') => esc(s.slice(0,1).toUpperCase() || '?');
function avatarMarkup(path,label){return '<div class="avatar"><span>'+initials(label)+'</span><img class="avatar-image" data-path="'+esc(path)+'" alt="" hidden onerror="this.remove()"></div>';}
async function loadAvatarImages(root=document){const images=[...root.querySelectorAll('img.avatar-image[data-path]')];await Promise.all(images.map(async img=>{if(img.dataset.loading==='1')return;img.dataset.loading='1';const {data,error}=await supabase.storage.from('mychat-images').createSignedUrl(img.dataset.path,3600);if(!img.isConnected)return;if(error||!data?.signedUrl){img.remove();return;}img.src=data.signedUrl;img.hidden=false;}));}
async function uploadImage(path,file){if(!file)return false;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Bitte ein JPG-, PNG- oder WebP-Bild auswählen.');return false;}if(file.size>5*1024*1024){toast('Das Bild darf höchstens 5 MB groß sein.');return false;}const {error}=await supabase.storage.from('mychat-images').upload(path,file,{upsert:true,contentType:file.type,cacheControl:'60'});if(error){showError(error);return false;}toast('Bild gespeichert.');return true;}
const ATTACHMENT_MIMES=['image/jpeg','image/png','image/webp','image/gif','application/pdf','text/plain','text/csv','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/vnd.ms-excel','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','application/vnd.ms-powerpoint','application/vnd.openxmlformats-officedocument.presentationml.presentation'];
const MAX_ATTACHMENT_SIZE=10*1024*1024,MAX_ATTACHMENTS=5;
function formatBytes(bytes){return bytes<1024*1024?Math.ceil(bytes/1024)+' KB':(bytes/1024/1024).toFixed(1)+' MB';}
function attachmentComposer(){return '<div id="attachment-list" class="attachment-list hidden"></div><form class="composer" id="message-form"><button class="btn attach-btn" id="attach-files" type="button" title="Dateien anhängen" aria-label="Dateien anhängen"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 12.5 7.8-7.8a4 4 0 0 1 5.7 5.7L10 21.9a6 6 0 0 1-8.5-8.5L12 2.9"/></svg></button><input class="hidden" id="file-input" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif,.pdf,.txt,.csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx"><input id="message-text" type="text" maxlength="5000" autocomplete="off" placeholder="Nachricht schreiben (optional) …" aria-label="Nachricht (optional)"><button class="btn primary" type="submit">Senden</button></form>';}
function renderAttachments(items){if(!items?.length)return '';return '<div class="message-files">'+items.map(a=>a.signedUrl?(a.mime_type.startsWith('image/')?'<a class="message-file" href="'+esc(a.signedUrl)+'" target="_blank" rel="noopener"><img src="'+esc(a.signedUrl)+'" alt="'+esc(a.file_name)+'"><span>'+esc(a.file_name)+'</span></a>':'<a class="message-file" href="'+esc(a.signedUrl)+'" target="_blank" rel="noopener" download="'+esc(a.file_name)+'"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 12.5 7.8-7.8a4 4 0 0 1 5.7 5.7L10 21.9a6 6 0 0 1-8.5-8.5L12 2.9"/></svg> '+esc(a.file_name)+' · '+formatBytes(a.size_bytes)+'</a>'):'<span class="attachment-chip"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 12.5 7.8-7.8a4 4 0 0 1 5.7 5.7L10 21.9a6 6 0 0 1-8.5-8.5L12 2.9"/></svg> '+esc(a.file_name)+'</span>').join('')+'</div>';}
async function loadMessageAttachments(messages){if(!messages.length)return;const ids=messages.map(m=>m.id);const {data,error}=await supabase.from('chat_message_attachments').select('id,message_id,object_path,file_name,mime_type,size_bytes').in('message_id',ids);if(error){showError(error);return;}const byMessage=new Map();for(const item of data||[]){const {data:signed}=await supabase.storage.from('mychat-files').createSignedUrl(item.object_path,3600);item.signedUrl=signed?.signedUrl||null;if(!byMessage.has(item.message_id))byMessage.set(item.message_id,[]);byMessage.get(item.message_id).push(item);}for(const message of messages)message.attachments=byMessage.get(message.id)||[];}

function messageActions(m){
 const pinned=state.pinnedMessages.some(p=>p.message_id===m.id);
 return '<div class="message-actions"><button class="btn" type="button" data-share-message="'+m.id+'"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg> Teilen</button><button class="btn" type="button" data-toggle-pin="'+m.id+'">'+(pinned?'<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 5 5-4 1-4 4v4l-2 2-2-6-6-2 2-2h4l4-4z"/></svg> Lösen':'<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 5 5-4 1-4 4v4l-2 2-2-6-6-2 2-2h4l4-4z"/></svg> Fixieren')+'</button>'+(m.sender_id===state.user.id?'<button class="btn danger" type="button" data-delete-message="'+m.id+'"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 14h12l1-14M9 7V4h6v3"/></svg> Löschen</button>':'')+'</div>';
}
function pinnedStrip(){
 if(!state.pinnedMessages.length)return '';
 const p=state.pinnedMessages[state.pinnedMessages.length-1];
 const m=state.messages.find(x=>x.id===p.message_id);
 if(!m)return '';
 const label=m.message_text||m.attachments?.[0]?.file_name||'Datei';
 return '<div class="pinned-strip"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 5 5-4 1-4 4v4l-2 2-2-6-6-2 2-2h4l4-4z"/></svg></span><span class="pin-text"><b>Fixiert:</b> '+esc(label)+'</span><button class="btn" type="button" data-unpin-message="'+m.id+'">Lösen</button></div>';
}
async function togglePinnedMessage(messageId){
 const pinned=state.pinnedMessages.some(p=>p.message_id===messageId);
 const result=pinned
  ? await supabase.from('chat_pinned_messages').delete().eq('message_id',messageId).eq('chat_id',state.activeChat)
  : await supabase.from('chat_pinned_messages').insert({chat_id:state.activeChat,message_id:messageId,pinned_by:state.user.id});
 if(result.error){showError(result.error);return;}
 await loadPinnedMessages();renderMessages();toast(pinned?'Nachricht gelöst.':'Nachricht fixiert.');
}
async function loadPinnedMessages(){
 const {data,error}=await supabase.from('chat_pinned_messages').select('id,chat_id,message_id,pinned_by,created_at').eq('chat_id',state.activeChat).order('created_at',{ascending:true});
 if(error){showError(error);state.pinnedMessages=[];return;}
 state.pinnedMessages=data||[];
}
async function deleteMessage(messageId){
 if(!confirm('Möchtest du diese eigene Nachricht wirklich löschen?'))return;
 const {error}=await supabase.from('chat_messages').update({deleted_at:new Date().toISOString()}).eq('id',messageId).eq('chat_id',state.activeChat);
 if(error){showError(error);return;}
 state.messages=state.messages.filter(m=>m.id!==messageId);
 state.pinnedMessages=state.pinnedMessages.filter(p=>p.message_id!==messageId);
 renderMessages();toast('Nachricht gelöscht.');
}
function wireMessageActions(){
 document.querySelectorAll('[data-toggle-pin],[data-unpin-message]').forEach(b=>b.addEventListener('click',()=>togglePinnedMessage(b.dataset.togglePin||b.dataset.unpinMessage)));
 document.querySelectorAll('[data-delete-message]').forEach(b=>b.addEventListener('click',()=>deleteMessage(b.dataset.deleteMessage)));
 document.querySelectorAll('[data-share-message]').forEach(b=>b.addEventListener('click',()=>openShareDialog(b.dataset.shareMessage)));
}
function openShareDialog(messageId){
 const choices=[...state.contacts.map(c=>({value:'direct:'+c.id,label:'Privat: @'+c.username})),...state.groups.map(g=>({value:'group:'+g.id,label:'Gruppe: '+g.title}))];
 if(!choices.length){toast('Du hast noch keine anderen Chats.');return;}
 const overlay=document.createElement('div');overlay.className='share-overlay';overlay.id='share-overlay';
 overlay.innerHTML='<div class="share-dialog"><h3>Nachricht teilen</h3><label class="small muted" for="share-target">Chat auswählen</label><select id="share-target">'+choices.map(x=>'<option value="'+esc(x.value)+'">'+esc(x.label)+'</option>').join('')+'</select><div class="share-dialog-actions"><button class="btn" id="share-cancel" type="button">Abbrechen</button><button class="btn primary" id="share-confirm" type="button">Teilen</button></div></div>';
 document.body.appendChild(overlay);
 $('#share-cancel').addEventListener('click',()=>overlay.remove());
 overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
 $('#share-confirm').addEventListener('click',async()=>{
  const target=$('#share-target').value,button=$('#share-confirm');button.disabled=true;
  try{
   let chatId;
   if(target.startsWith('group:'))chatId=target.slice(6);
   else {const {data,error}=await supabase.rpc('create_direct_chat',{p_other_user:target.slice(7)});if(error)throw error;chatId=data;}
   await forwardMessage(messageId,chatId);
   overlay.remove();
  }catch(error){showError(error);button.disabled=false;}
 });
}
async function forwardMessage(messageId,targetChatId){
 const original=state.messages.find(m=>m.id===messageId);if(!original)throw new Error('Nachricht nicht gefunden.');
 const {data:newMessage,error}=await supabase.from('chat_messages').insert({chat_id:targetChatId,sender_id:state.user.id,message_text:original.message_text||''}).select('id').single();
 if(error)throw error;
 const metadata=[];
 for(const file of original.attachments||[]){
  const newId=crypto.randomUUID(),newPath=targetChatId+'/'+state.user.id+'/'+newId;
  const {error:copyError}=await supabase.storage.from('mychat-files').copy(file.object_path,newPath);
  if(copyError)throw copyError;
  metadata.push({id:newId,message_id:newMessage.id,chat_id:targetChatId,uploader_id:state.user.id,object_path:newPath,file_name:file.file_name,mime_type:file.mime_type,size_bytes:file.size_bytes});
 }
 if(metadata.length){const {error:metaError}=await supabase.from('chat_message_attachments').insert(metadata);if(metaError)throw metaError;}
 toast('Nachricht weitergeleitet.');
}

function setupComposer(){
 const form=$('#message-form'),picker=$('#file-input'),list=$('#attachment-list'),attach=$('#attach-files');
 if(!form||!picker)return;
 let selected=[];
 function refresh(){
  list.innerHTML=selected.map((file,i)=>'<span class="attachment-chip"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 12.5 7.8-7.8a4 4 0 0 1 5.7 5.7L10 21.9a6 6 0 0 1-8.5-8.5L12 2.9"/></svg> '+esc(file.name)+' · '+formatBytes(file.size)+' <button type="button" data-remove-file="'+i+'" aria-label="Entfernen">×</button></span>').join('');
  list.classList.toggle('hidden',!selected.length);
  list.querySelectorAll('[data-remove-file]').forEach(button=>button.addEventListener('click',()=>{selected.splice(Number(button.dataset.removeFile),1);refresh();}));
 }
 attach.addEventListener('click',()=>picker.click());
 picker.addEventListener('change',()=>{
  for(const file of [...picker.files]){
   if(selected.length>=MAX_ATTACHMENTS){toast('Maximal 5 Dateien pro Nachricht.');break;}
   if(!ATTACHMENT_MIMES.includes(file.type)){toast('Dieser Dateityp wird nicht unterstützt: '+file.name);continue;}
   if(file.size>MAX_ATTACHMENT_SIZE){toast(file.name+' ist größer als 10 MB.');continue;}
   selected.push(file);
  }
  picker.value='';refresh();
 });
 form.addEventListener('submit',async e=>{
  e.preventDefault();
  const message=$('#message-text').value.trim();
  if(!message&&!selected.length){toast('Wähle mindestens eine Datei aus oder schreibe eine Nachricht.');return;}
  const send=form.querySelector('button[type="submit"]');
  send.disabled=true;attach.disabled=true;
  try{
   const {data:msg,error}=await supabase.from('chat_messages').insert({chat_id:state.activeChat,sender_id:state.user.id,message_text:message}).select('id,chat_id,sender_id,message_text,created_at').single();
   if(error)throw error;
   const metadata=[];
   for(const file of selected){
    const id=crypto.randomUUID(),path=state.activeChat+'/'+state.user.id+'/'+id;
    const {error:uploadError}=await supabase.storage.from('mychat-files').upload(path,file,{contentType:file.type,upsert:false});
    if(uploadError)throw uploadError;
    metadata.push({id,message_id:msg.id,chat_id:state.activeChat,uploader_id:state.user.id,object_path:path,file_name:file.name,mime_type:file.type,size_bytes:file.size});
   }
   if(metadata.length){const {error:metaError}=await supabase.from('chat_message_attachments').insert(metadata);if(metaError)throw metaError;}
   state.messages.push(msg);$('#message-text').value='';selected=[];refresh();
   await loadMessageAttachments([msg]);renderMessages();
  }catch(error){showError(error);}
  finally{send.disabled=false;attach.disabled=false;}
 });
}
function toast(message){const el=$('#toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),3200)}
function showError(error){console.error(error);toast(error?.message || String(error))}
function authView(){ $('#root').innerHTML=`
<div class="auth-wrap"><section class="auth-card">
<div class="brand"><img src="./icons/mychat.svg" alt=""><div><h1>MyChat</h1><p>Ein Teil deines MyDigital-Kontos</p></div></div>
<form id="login-form"><label class="small muted" for="email">E-Mail-Adresse</label><input id="email" type="email" autocomplete="username" required placeholder="name@beispiel.de"><label class="small muted" for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" required placeholder="Dein MyDigital-Passwort"><button class="btn primary full" type="submit">Mit MyDigital anmelden</button><p id="auth-error" class="error"></p></form>
<p class="small muted">Du verwendest dieselbe E-Mail-Adresse und dasselbe Passwort wie bei MyDigital. Neue Konten werden über MyDigital erstellt.</p><a class="btn subtle full" href="https://kotzschfelix-sudo.github.io/MyDigital/">← Zum Dashboard</a>
</section></div>`;
$('#login-form').addEventListener('submit', async e=>{e.preventDefault();const btn=e.currentTarget.querySelector('button');btn.disabled=true;$('#auth-error').textContent='';const {error}=await supabase.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});btn.disabled=false;if(error)$('#auth-error').textContent='Anmeldung fehlgeschlagen. Bitte prüfe E-Mail und Passwort.';});
}
function appShell(){ $('#root').innerHTML=`
<div class="app"><header class="topbar"><div class="brand"><img src="./icons/mychat.svg" alt=""><div><h1>MyChat</h1></div></div><span class="muted small">MyDigital</span><span class="spacer"></span><div class="user-pill"><button class="avatar avatar-button" id="change-profile-photo" type="button" title="Profilbild ändern"><span>${initials(state.username)}</span><img class="avatar-image" data-path="profiles/${state.user.id}/avatar" alt="" hidden onerror="this.remove()"></button><input class="hidden" id="profile-photo-input" type="file" accept="image/jpeg,image/png,image/webp"><span id="my-username"></span><a class="btn subtle" href="https://kotzschfelix-sudo.github.io/MyDigital/">Dashboard</a><button class="btn subtle" id="logout">Abmelden</button></div></header>
<div class="workspace"><aside class="sidebar"><div class="side-scroll">
<section><h3 class="section-title">Nutzer suchen</h3><input id="user-search" type="search" placeholder="Benutzername eingeben" autocomplete="off"><div id="search-results" class="search-results"></div></section>
<section><h3 class="section-title">Kontaktanfragen</h3><div id="requests" class="request-list"></div></section>
<section><h3 class="section-title">Kontakte</h3><div id="contacts" class="contact-list"></div></section>
<section><div class="section-row"><h3 class="section-title">Gruppen</h3><button class="btn" id="show-group-form" type="button">+ Neu</button></div><div id="group-form" class="group-form hidden"><input id="group-title" maxlength="60" placeholder="Gruppenname"><div id="group-contact-options" class="group-options"></div><button class="btn primary" id="make-group" type="button">Gruppe erstellen</button></div><div id="groups" class="contact-list"></div></section>
</div></aside>
<main class="chat-panel" id="chat-panel"><div class="welcome"><div class="big-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div><h2>Willkommen bei MyChat</h2><p class="muted">Suche nach einem MyDigital-Benutzernamen und sende eine Kontaktanfrage. Sobald sie angenommen wurde, könnt ihr chatten.</p></div></main>
</div></div>`;
$('#logout').addEventListener('click',()=>supabase.auth.signOut());
const profileInput=$('#profile-photo-input');$('#change-profile-photo').addEventListener('click',()=>profileInput.click());profileInput.addEventListener('change',async()=>{const file=profileInput.files?.[0];if(await uploadImage('profiles/'+state.user.id+'/avatar',file)){await loadSidebar();const img=$('#change-profile-photo .avatar-image');if(img){delete img.dataset.loading;img.removeAttribute('src');img.hidden=true;}await loadAvatarImages($('#root'));}profileInput.value='';});
$('#show-group-form').addEventListener('click',()=>{const form=$('#group-form');form.classList.toggle('hidden');$('#group-contact-options').innerHTML=state.contacts.length?state.contacts.map(p=>'<label class="group-option"><input type="checkbox" value="'+p.id+'"><span>@'+esc(p.username)+'</span></label>').join(''):'<p class="small muted">Du brauchst zuerst bestätigte Kontakte.</p>';});
$('#make-group').addEventListener('click',createGroup);
$('#user-search').addEventListener('input',e=>{clearTimeout(state.searchTimer);const q=e.target.value.trim().toLowerCase();state.searchTimer=setTimeout(()=>searchUsers(q),250)});
}
async function boot(){
 const {data:{session}}=await supabase.auth.getSession();
 if(!session){state.user=null;authView();return}
 state.user=session.user;
 const {data:profile,error}=await supabase.from('profiles').select('username').eq('id',state.user.id).maybeSingle();
 if(error){showError(error);return}
 state.username=profile?.username || state.user.email?.split('@')[0] || 'MyDigital-Nutzer';
 appShell();$('#my-username').textContent='@'+state.username;
 await loadSidebar();await loadAvatarImages($('#root'));
}
async function searchUsers(query){
 const box=$('#search-results');if(!box)return;
 if(query.length<3){box.innerHTML=query?'<p class="small muted">Mindestens 3 Zeichen eingeben.</p>':'';return}
 const {data,error}=await supabase.from('profiles').select('id,username').ilike('username',query.replace(/[%_]/g,'\\$&')+'%').neq('id',state.user.id).order('username').limit(12);
 if(error){box.innerHTML='<p class="error">Suche momentan nicht möglich.</p>';return}
 box.innerHTML=data.length?data.map(p=>`<div class="result">${avatarMarkup("profiles/"+p.id+"/avatar",p.username)}<div class="person"><b>@${esc(p.username)}</b><small>MyDigital-Nutzer</small></div><button class="btn" data-request="${p.id}">Anfragen</button></div>`).join(''):'<p class="small muted">Kein Nutzer gefunden.</p>';
 box.querySelectorAll('[data-request]').forEach(btn=>btn.addEventListener('click',()=>sendRequest(btn.dataset.request,btn)));
}
async function sendRequest(userId,button){
 button.disabled=true;
 const {error}=await supabase.from('chat_contact_requests').insert({sender_id:state.user.id,receiver_id:userId,status:'pending'});
 if(error){button.disabled=false;toast(error.code==='23505'?'Für diesen Nutzer besteht bereits eine Anfrage oder ein Kontakt.':error.message);return}
 button.textContent='Gesendet';toast('Kontaktanfrage gesendet.');await loadSidebar();
}
async function loadSidebar(){
 const [reqRes,memberRes]=await Promise.all([
  supabase.from('chat_contact_requests').select('id,sender_id,receiver_id,status,created_at').or('sender_id.eq.'+state.user.id+',receiver_id.eq.'+state.user.id).order('created_at',{ascending:false}),
  supabase.from('chat_members').select('chat_id').eq('user_id',state.user.id)
 ]);
 if(reqRes.error)showError(reqRes.error);if(memberRes.error)showError(memberRes.error);
 state.requests=reqRes.data||[];
 const accepted=state.requests.filter(r=>r.status==='accepted');
 const ids=[...new Set(accepted.map(r=>r.sender_id===state.user.id?r.receiver_id:r.sender_id))];
 const requestIds=state.requests.filter(r=>r.receiver_id===state.user.id&&r.status==='pending').map(r=>r.sender_id);
 const lookupIds=[...new Set([...ids,...requestIds])];
 const [profilesRes, chatsRes]=await Promise.all([
  lookupIds.length?supabase.from('profiles').select('id,username').in('id',lookupIds):Promise.resolve({data:[],error:null}),
  memberRes.data?.length?supabase.from('chats').select('id,chat_type,title,created_at').in('id',memberRes.data.map(x=>x.chat_id)):Promise.resolve({data:[],error:null})
 ]);
 if(profilesRes.error)showError(profilesRes.error);if(chatsRes.error)showError(chatsRes.error);
 const profileMap=new Map((profilesRes.data||[]).map(p=>[p.id,p.username]));
 state.requestProfiles=profileMap;
 state.contacts=accepted.map(r=>{const id=r.sender_id===state.user.id?r.receiver_id:r.sender_id;return{id,username:profileMap.get(id)||'MyDigital-Nutzer'}}).sort((a,b)=>a.username.localeCompare(b.username));
 state.chats=chatsRes.data||[];
 state.groups=state.chats.filter(chat=>chat.chat_type==='group');
 renderSidebar();
}
function renderSidebar(){
 const incoming=state.requests.filter(r=>r.receiver_id===state.user.id&&r.status==='pending');
 const reqBox=$('#requests');
 if(reqBox){reqBox.innerHTML=incoming.length?incoming.map(r=>`<div class="request">${avatarMarkup("profiles/"+r.sender_id+"/avatar",state.requestProfiles.get(r.sender_id)||"M")}<div class="person"><b>@${esc(state.requestProfiles.get(r.sender_id)||"MyDigital-Nutzer")}</b><small>möchte dich hinzufügen</small></div><div class="request-actions"><button class="btn" data-accept="${r.id}">Annehmen</button><button class="btn danger" data-decline="${r.id}">Ablehnen</button></div></div>`).join(''):'<p class="small muted">Keine offenen Anfragen.</p>';
 reqBox.querySelectorAll('[data-accept]').forEach(b=>b.addEventListener('click',()=>answerRequest(b.dataset.accept,'accepted')));
 reqBox.querySelectorAll('[data-decline]').forEach(b=>b.addEventListener('click',()=>answerRequest(b.dataset.decline,'declined')));
 }
 const cbox=$('#contacts');
 if(cbox){cbox.innerHTML=state.contacts.length?state.contacts.map(c=>`<button class="contact ${state.activeContact===c.id?'active':''}" data-contact="${c.id}">${avatarMarkup("profiles/"+c.id+"/avatar",c.username)}<div class="person"><b>@${esc(c.username)}</b><small>Kontakt</small></div></button>`).join(''):'<p class="small muted">Noch keine Kontakte.</p>';
 cbox.querySelectorAll('[data-contact]').forEach(b=>b.addEventListener('click',()=>openContact(b.dataset.contact)));
 }

 const gbox=$('#groups');
 if(gbox){gbox.innerHTML=state.groups.length?state.groups.map(g=>'<button class="group '+(state.activeChat===g.id?'active':'')+'" data-group="'+g.id+'">'+avatarMarkup('groups/'+g.id+'/avatar',g.title||'Gruppe')+'<div class="person"><b>'+esc(g.title||'Gruppe')+'</b><small>Gruppenchat</small></div></button>').join(''):'<p class="small muted">Noch keine Gruppen.</p>';gbox.querySelectorAll('[data-group]').forEach(b=>b.addEventListener('click',()=>openGroup(b.dataset.group)));loadAvatarImages(gbox);}
}
async function answerRequest(id,status){
 const {error}=await supabase.from('chat_contact_requests').update({status,updated_at:new Date().toISOString()}).eq('id',id);
 if(error){showError(error);return}toast(status==='accepted'?'Kontakt hinzugefügt.':'Anfrage abgelehnt.');await loadSidebar();
}
async function createGroup(){
 const title=$('#group-title').value.trim();const ids=[...$('#group-contact-options').querySelectorAll('input[type="checkbox"]:checked')].map(input=>input.value);
 if(title.length<2){toast('Bitte gib einen Gruppennamen ein.');return}if(!ids.length){toast('Wähle mindestens einen Kontakt aus.');return}
 const button=$('#make-group');button.disabled=true;const {data,error}=await supabase.rpc('create_group_chat',{p_title:title,p_member_ids:ids});button.disabled=false;
 if(error){showError(error);return}$('#group-title').value='';$('#group-form').classList.add('hidden');toast('Gruppe erstellt.');await loadSidebar();await openGroup(data);
}
async function openGroup(chatId){
 const group=state.groups.find(g=>g.id===chatId);if(!group)return;state.activeContact=null;state.activeChat=chatId;state.activeChatType='group';state.activeGroupTitle=group.title||'Gruppe';renderSidebar();await loadMessages();
 if(state.channel)await supabase.removeChannel(state.channel);state.channel=supabase.channel('mychat-'+chatId).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'chat_id=eq.'+chatId},payload=>{if(payload.new.sender_id!==state.user.id){state.messages.push(payload.new);renderMessages()}}).subscribe();
}
async function openContact(userId){
 state.activeContact=userId;state.activeChatType='direct';
 const contact=state.contacts.find(c=>c.id===userId);if(!contact)return;
 const {data:chatId,error}=await supabase.rpc('create_direct_chat',{p_other_user:userId});
 if(error){showError(error);return}
 state.activeChat=chatId;renderSidebar();
 await loadMessages();
 if(state.channel)await supabase.removeChannel(state.channel);
 state.channel=supabase.channel('mychat-'+chatId).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'chat_id=eq.'+chatId},payload=>{
   if(payload.new.sender_id!==state.user.id){state.messages.push(payload.new);renderMessages()}
 }).subscribe();
}
async function loadMessages(){
 const {data,error}=await supabase.from('chat_messages').select('id,chat_id,sender_id,message_text,created_at').eq('chat_id',state.activeChat).is('deleted_at',null).order('created_at',{ascending:true}).limit(100);
 if(error){showError(error);return}
 state.messages=data||[];await loadMessageAttachments(state.messages);await loadPinnedMessages();renderMessages();
}
function renderMessages(){
 if(state.activeChatType==='group'){renderGroupMessages();return}
 const contact=state.contacts.find(c=>c.id===state.activeContact);const panel=$('#chat-panel');if(!panel||!contact)return;
 panel.innerHTML=`<header class="chat-head">${avatarMarkup("profiles/"+contact.id+"/avatar",contact.username)}<div><h2>@${esc(contact.username)}</h2><small>Privater Chat</small></div></header>${pinnedStrip()}<div class="messages" id="messages">${state.messages.length?state.messages.map(m=>`<article class="bubble ${m.sender_id===state.user.id?'mine':''}">${m.message_text?'<div>'+esc(m.message_text)+'</div>':''}${renderAttachments(m.attachments)}<div class="meta">${new Date(m.created_at).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})}</div>${messageActions(m)}</article>`).join(''):'<p class="empty">Noch keine Nachrichten. Schreib die erste Nachricht!</p>'}</div>${attachmentComposer()}`;
 const list=$('#messages');list.scrollTop=list.scrollHeight;loadAvatarImages(panel);setupComposer();wireMessageActions();
}
function renderGroupMessages(){
 const panel=$('#chat-panel');if(!panel)return;
 panel.innerHTML=`<header class="chat-head">${avatarMarkup("groups/"+state.activeChat+"/avatar",state.activeGroupTitle)}<div><h2>${esc(state.activeGroupTitle)}</h2><small>Gruppenchat</small></div><span class="spacer"></span><button class="btn" id="change-group-photo" type="button">Gruppenbild ändern</button><input class="hidden" id="group-photo-input" type="file" accept="image/jpeg,image/png,image/webp"></header>${pinnedStrip()}<div class="messages" id="messages">${state.messages.length?state.messages.map(m=>'<article class="bubble '+(m.sender_id===state.user.id?'mine':'')+'">'+(m.message_text?'<div>'+esc(m.message_text)+'</div>':'')+renderAttachments(m.attachments)+'<div class="meta">'+(m.sender_id===state.user.id?'Du':'Mitglied')+' · '+new Date(m.created_at).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})+'</div>'+messageActions(m)+'</article>').join(''):'<p class="empty">Noch keine Nachrichten. Schreib die erste Nachricht!</p>'}</div>${attachmentComposer()}`;
 const list=$('#messages');list.scrollTop=list.scrollHeight;loadAvatarImages(panel);
 const photoInput=$('#group-photo-input');$('#change-group-photo').addEventListener('click',()=>photoInput.click());photoInput.addEventListener('change',async()=>{const file=photoInput.files?.[0];if(await uploadImage('groups/'+state.activeChat+'/avatar',file)){await loadSidebar();renderGroupMessages();}photoInput.value='';});
 setupComposer();wireMessageActions();
}

supabase.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT')setTimeout(boot,0)});
boot();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
