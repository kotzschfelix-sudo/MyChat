<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<meta name="description" content="MyChat – private Nachrichten für dein MyDigital-Konto.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/mychat.svg" type="image/svg+xml">
<title>MyChat · MyDigital</title>
<style>
:root{color-scheme:dark;--bg:#08090c;--panel:#111318;--panel2:#181b22;--line:#292e38;--text:#f4f5f7;--muted:#9aa2b1;--accent:#e9ebf0;--accentText:#101116;--green:#4ade80;--red:#f87171}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 10% -15%,#252a35 0,transparent 60%),var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.error{color:var(--red);font-size:13px}.success{color:var(--green);font-size:13px}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(420px,100%);background:#12151b;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 20px 70px #0008}.brand{display:flex;align-items:center;gap:12px}.brand img{width:54px;height:54px}.brand h1{font-size:25px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}.auth-card form{display:grid;gap:12px;margin-top:24px}
input{width:100%;background:#0c0e13;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;outline:none}input:focus{border-color:#858d9c}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel2);color:var(--text)}.btn.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:650}.btn.subtle{background:transparent}.btn.danger{color:#fecaca}.btn.full{width:100%}
.app{height:100dvh;min-height:540px;display:grid;grid-template-rows:66px 1fr;max-width:1500px;margin:auto;padding:0 16px}.topbar{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.topbar .brand img{width:38px;height:38px}.topbar .brand h1{font-size:20px}.topbar .spacer{flex:1}.user-pill{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.workspace{min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;padding:14px 0}.sidebar,.chat-panel{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:18px;min-height:0}.sidebar{display:flex;flex-direction:column;overflow:hidden}.side-scroll{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:16px}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}.search-results,.request-list,.contact-list{display:grid;gap:7px}.result,.contact,.request{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--text);text-align:left;width:100%}.result:hover,.contact:hover,.contact.active{background:var(--panel2);border-color:var(--line)}.avatar{width:38px;height:38px;border-radius:50%;background:#303642;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}.person{min-width:0;flex:1}.person b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person small{display:block;color:var(--muted);margin-top:3px}.request-actions{display:flex;gap:5px}.request-actions .btn{padding:6px 9px;font-size:12px}.empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 12px}
.chat-panel{display:flex;flex-direction:column;overflow:hidden}.chat-head{height:68px;display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}.chat-head h2{font-size:16px;margin:0}.chat-head small{display:block;color:var(--muted);margin-top:3px}.messages{flex:1;min-height:0;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:min(72%,620px);align-self:flex-start;background:#20242d;border:1px solid #2d333f;border-radius:16px 16px 16px 5px;padding:10px 13px;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#e8eaf0;color:#12141a;border-color:#e8eaf0;border-radius:16px 16px 5px 16px}.bubble .meta{font-size:11px;opacity:.65;margin-top:5px}.composer{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}.composer input{flex:1}.welcome{margin:auto;text-align:center;padding:28px;max-width:420px}.welcome .big-icon{font-size:42px;margin-bottom:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#272c36;border:1px solid #424958;padding:10px 15px;border-radius:12px;z-index:10;max-width:calc(100vw - 30px);box-shadow:0 10px 30px #0008}
@media(max-width:760px){.app{padding:0;grid-template-rows:60px 1fr}.topbar{padding:0 12px}.workspace{padding:8px;grid-template-columns:1fr;gap:8px}.sidebar{min-height:0;max-height:42vh}.chat-panel{min-height:0}.side-scroll{padding:10px}.chat-head{height:58px;padding:9px 12px}.messages{padding:12px}.bubble{max-width:88%}.user-pill span{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast hidden" role="status"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';

const SUPABASE_URL = 'https://pmlcstqpmmoiqnvfxspl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_kx4UGLboJuhwN6P3JcbNZg_-39zZoZV';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (s) => document.querySelector(s);
const state = { user:null, username:'', requests:[], contacts:[], chats:[], activeChat:null, activeContact:null, requestProfiles:{}, messages:[], channel:null, searchTimer:null };
const esc = (v='') => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = (s='?') => esc(s.slice(0,1).toUpperCase() || '?');
function toast(message){const el=$('#toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),3200)}
function showError(error){console.error(error);toast(error?.message || String(error))}
function authView(){ $('#root').innerHTML=`
<div class="auth-wrap"><section class="auth-card">
<div class="brand"><img src="./icons/mychat.svg" alt=""><div><h1>MyChat</h1><p>Ein Teil deines MyDigital-Kontos</p></div></div>
<form id="login-form"><label class="small muted" for="email">E-Mail-Adresse</label><input id="email" type="email" autocomplete="username" required placeholder="name@beispiel.de"><label class="small muted" for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" required placeholder="Dein MyDigital-Passwort"><button class="btn primary full" type="submit">Mit MyDigital anmelden</button><p id="auth-error" class="error"></p></form>
<p class="small muted">Du verwendest dieselbe E-Mail-Adresse und dasselbe Passwort wie bei MyDigital. Neue Konten werden über MyDigital erstellt.</p>
</section></div>`;
$('#login-form').addEventListener('submit', async e=>{e.preventDefault();const btn=e.currentTarget.querySelector('button');btn.disabled=true;$('#auth-error').textContent='';const {error}=await supabase.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});btn.disabled=false;if(error)$('#auth-error').textContent='Anmeldung fehlgeschlagen. Bitte prüfe E-Mail und Passwort.';});
}
function appShell(){ $('#root').innerHTML=`
<div class="app"><header class="topbar"><div class="brand"><img src="./icons/mychat.svg" alt=""><div><h1>MyChat</h1></div></div><span class="muted small">MyDigital</span><span class="spacer"></span><div class="user-pill"><span id="my-username"></span><button class="btn subtle" id="logout">Abmelden</button></div></header>
<div class="workspace"><aside class="sidebar"><div class="side-scroll">
<section><h3 class="section-title">Nutzer suchen</h3><input id="user-search" type="search" placeholder="Benutzername eingeben" autocomplete="off"><div id="search-results" class="search-results"></div></section>
<section><h3 class="section-title">Kontaktanfragen</h3><div id="requests" class="request-list"></div></section>
<section><h3 class="section-title">Kontakte</h3><div id="contacts" class="contact-list"></div></section>
</div></aside>
<main class="chat-panel" id="chat-panel"><div class="welcome"><div class="big-icon">✉</div><h2>Willkommen bei MyChat</h2><p class="muted">Suche nach einem MyDigital-Benutzernamen und sende eine Kontaktanfrage. Sobald sie angenommen wurde, könnt ihr chatten.</p></div></main>
</div></div>`;
$('#logout').addEventListener('click',()=>supabase.auth.signOut());
$('#user-search').addEventListener('input',e=>{clearTimeout(state.searchTimer);const q=e.target.value.trim().toLowerCase();state.searchTimer=setTimeout(()=>searchUsers(q),250)});
}
async function boot(){
 const {data:{session}}=await supabase.auth.getSession();
 if(!session){state.user=null;authView();return}
 state.user=session.user;
 const {data:profile,error}=await supabase.from('profiles').select('username').eq('id',state.user.id).maybeSingle();
 if(error){showError(error);return}
 state.username=profile?.username || state.user.email?.split('@')[0] || 'MyDigital-Nutzer';
 appShell();$('#my-username').textContent='@'+state.username;
 await loadSidebar();
}
async function searchUsers(query){
 const box=$('#search-results');if(!box)return;
 if(query.length<3){box.innerHTML=query?'<p class="small muted">Mindestens 3 Zeichen eingeben.</p>':'';return}
 const {data,error}=await supabase.from('profiles').select('id,username').ilike('username',query.replace(/[%_]/g,'\\$&')+'%').neq('id',state.user.id).order('username').limit(12);
 if(error){box.innerHTML='<p class="error">Suche momentan nicht möglich.</p>';return}
 box.innerHTML=data.length?data.map(p=>`<div class="result"><div class="avatar">${initials(p.username)}</div><div class="person"><b>@${esc(p.username)}</b><small>MyDigital-Nutzer</small></div><button class="btn" data-request="${p.id}">Anfragen</button></div>`).join(''):'<p class="small muted">Kein Nutzer gefunden.</p>';
 box.querySelectorAll('[data-request]').forEach(btn=>btn.addEventListener('click',()=>sendRequest(btn.dataset.request,btn)));
}
async function sendRequest(userId,button){
 button.disabled=true;
 const {error}=await supabase.from('chat_contact_requests').insert({sender_id:state.user.id,receiver_id:userId,status:'pending'});
 if(error){button.disabled=false;toast(error.code==='23505'?'Für diesen Nutzer besteht bereits eine Anfrage oder ein Kontakt.':error.message);return}
 button.textContent='Gesendet';toast('Kontaktanfrage gesendet.');await loadSidebar();
}
async function loadSidebar(){
 const [reqRes,memberRes]=await Promise.all([
  supabase.from('chat_contact_requests').select('id,sender_id,receiver_id,status,created_at').or('sender_id.eq.'+state.user.id+',receiver_id.eq.'+state.user.id).order('created_at',{ascending:false}),
  supabase.from('chat_members').select('chat_id').eq('user_id',state.user.id)
 ]);
 if(reqRes.error)showError(reqRes.error);if(memberRes.error)showError(memberRes.error);
 state.requests=reqRes.data||[];
 const accepted=state.requests.filter(r=>r.status==='accepted');
 const ids=[...new Set(accepted.map(r=>r.sender_id===state.user.id?r.receiver_id:r.sender_id))];
 const requestIds=state.requests.filter(r=>r.receiver_id===state.user.id&&r.status==='pending').map(r=>r.sender_id);
 const lookupIds=[...new Set([...ids,...requestIds])];
 const [profilesRes, chatsRes]=await Promise.all([
  lookupIds.length?supabase.from('profiles').select('id,username').in('id',lookupIds):Promise.resolve({data:[],error:null}),
  memberRes.data?.length?supabase.from('chats').select('id,chat_type,created_at').in('id',memberRes.data.map(x=>x.chat_id)):Promise.resolve({data:[],error:null})
 ]);
 if(profilesRes.error)showError(profilesRes.error);if(chatsRes.error)showError(chatsRes.error);
 const profileMap=new Map((profilesRes.data||[]).map(p=>[p.id,p.username]));
 state.requestProfiles=profileMap;
 state.contacts=accepted.map(r=>{const id=r.sender_id===state.user.id?r.receiver_id:r.sender_id;return{id,username:profileMap.get(id)||'MyDigital-Nutzer'}}).sort((a,b)=>a.username.localeCompare(b.username));
 state.chats=chatsRes.data||[];
 renderSidebar();
}
function renderSidebar(){
 const incoming=state.requests.filter(r=>r.receiver_id===state.user.id&&r.status==='pending');
 const reqBox=$('#requests');
 if(reqBox){reqBox.innerHTML=incoming.length?incoming.map(r=>`<div class="request"><div class="avatar">${initials(state.requestProfiles.get(r.sender_id)||"M")}</div><div class="person"><b>@${esc(state.requestProfiles.get(r.sender_id)||"MyDigital-Nutzer")}</b><small>möchte dich hinzufügen</small></div><div class="request-actions"><button class="btn" data-accept="${r.id}">Annehmen</button><button class="btn danger" data-decline="${r.id}">Ablehnen</button></div></div>`).join(''):'<p class="small muted">Keine offenen Anfragen.</p>';
 reqBox.querySelectorAll('[data-accept]').forEach(b=>b.addEventListener('click',()=>answerRequest(b.dataset.accept,'accepted')));
 reqBox.querySelectorAll('[data-decline]').forEach(b=>b.addEventListener('click',()=>answerRequest(b.dataset.decline,'declined')));
 }
 const cbox=$('#contacts');
 if(cbox){cbox.innerHTML=state.contacts.length?state.contacts.map(c=>`<button class="contact ${state.activeContact===c.id?'active':''}" data-contact="${c.id}"><div class="avatar">${initials(c.username)}</div><div class="person"><b>@${esc(c.username)}</b><small>Kontakt</small></div></button>`).join(''):'<p class="small muted">Noch keine Kontakte.</p>';
 cbox.querySelectorAll('[data-contact]').forEach(b=>b.addEventListener('click',()=>openContact(b.dataset.contact)));
 }

}
async function answerRequest(id,status){
 const {error}=await supabase.from('chat_contact_requests').update({status,updated_at:new Date().toISOString()}).eq('id',id);
 if(error){showError(error);return}toast(status==='accepted'?'Kontakt hinzugefügt.':'Anfrage abgelehnt.');await loadSidebar();
}
async function openContact(userId){
 state.activeContact=userId;
 const contact=state.contacts.find(c=>c.id===userId);if(!contact)return;
 const {data:chatId,error}=await supabase.rpc('create_direct_chat',{p_other_user:userId});
 if(error){showError(error);return}
 state.activeChat=chatId;renderSidebar();
 await loadMessages();
 if(state.channel)await supabase.removeChannel(state.channel);
 state.channel=supabase.channel('mychat-'+chatId).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'chat_id=eq.'+chatId},payload=>{
   if(payload.new.sender_id!==state.user.id){state.messages.push(payload.new);renderMessages()}
 }).subscribe();
}
async function loadMessages(){
 const {data,error}=await supabase.from('chat_messages').select('id,chat_id,sender_id,message_text,created_at').eq('chat_id',state.activeChat).is('deleted_at',null).order('created_at',{ascending:true}).limit(100);
 if(error){showError(error);return}
 state.messages=data||[];renderMessages();
}
function renderMessages(){
 const contact=state.contacts.find(c=>c.id===state.activeContact);const panel=$('#chat-panel');if(!panel||!contact)return;
 panel.innerHTML=`<header class="chat-head"><div class="avatar">${initials(contact.username)}</div><div><h2>@${esc(contact.username)}</h2><small>Privater Chat</small></div></header><div class="messages" id="messages">${state.messages.length?state.messages.map(m=>`<article class="bubble ${m.sender_id===state.user.id?'mine':''}"><div>${esc(m.message_text)}</div><div class="meta">${new Date(m.created_at).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})}</div></article>`).join(''):'<p class="empty">Noch keine Nachrichten. Schreib die erste Nachricht!</p>'}</div><form class="composer" id="message-form"><input id="message-text" maxlength="5000" autocomplete="off" placeholder="Nachricht schreiben …" aria-label="Nachricht"><button class="btn primary" type="submit">Senden</button></form>`;
 const list=$('#messages');list.scrollTop=list.scrollHeight;
 $('#message-form').addEventListener('submit',sendMessage);
}
async function sendMessage(e){
 e.preventDefault();const input=$('#message-text');const text=input.value.trim();if(!text)return;
 const button=e.currentTarget.querySelector('button');button.disabled=true;
 const {data,error}=await supabase.from('chat_messages').insert({chat_id:state.activeChat,sender_id:state.user.id,message_text:text}).select('id,chat_id,sender_id,message_text,created_at').single();
 button.disabled=false;if(error){showError(error);return}
 state.messages.push(data);renderMessages();
}
supabase.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT')setTimeout(boot,0)});
boot();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
